      <stop offset="0" stop-color="#0a1024"/>
      <stop offset="1" stop-color="#05060e"/>
    </linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)"/>
  <rect x="10" y="10" width="172" height="172" rx="34" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.8"/>
